<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Pixeldrop resting orb mark, monochrome</title>
  <desc id="desc">A monochrome circular field of square tiles within a quiet ring.</desc>
  <defs><clipPath id="clip"><circle cx="64" cy="64" r="48"/></clipPath><pattern id="tiles" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="11" height="11" fill="currentColor"/></pattern></defs>
  <circle cx="64" cy="64" r="55" fill="none" stroke="currentColor" stroke-width="2" opacity=".72"/>
  <circle cx="64" cy="64" r="48" fill="#211612"/>
  <rect x="16" y="16" width="98" height="98" fill="url(#tiles)" clip-path="url(#clip)"/>
</svg>
